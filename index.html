<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="todo-box">
        <h1>📝 My To-Do List</h1>
        
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..." 
                onkeypress="handleKeyPress(event)">
            <button onclick="addTask()" class="add-btn">
                <i class="fas fa-plus"></i> Add
            </button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" onclick="filterTasks('all')">All</button>
            <button class="filter-btn" onclick="filterTasks('active')">Active</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
        </div>

        <div class="stats">
            <p>Total: <span id="totalTasks">0</span></p>
            <p>Completed: <span id="completedTasks">0</span></p>
        </div>

        <ul class="task-list" id="taskList">
        </ul>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-inbox"></i>
            <p>No tasks yet. Add one to get started!</p>
        </div>

        <button onclick="clearAllTasks()" class="clear-all-btn hidden">
            <i class="fas fa-trash"></i> Clear All Tasks
        </button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
